name: BrainOS Desktop CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-initramfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y binutils gzip
      - name: Shell and Python syntax
        run: |
          bash -n kit/integration/brainos-launch kit/integration/brainos-session
          bash -n kit/integration/merge-into-toybox.sh kit/integration/verify-runtime.sh
          bash -n kit/brainos-qt/packaging/build-iso.sh kit/brainos-qt/packaging/build-release.sh
          bash -n kit/brainos-qt/packaging/scripts/brainos-install kit/brainos-qt/packaging/scripts/bundle-qt-runtime.sh
          bash -n kit/brainos-qt/packaging/scripts/bundle-szh-terminal.sh
          bash -n scripts/*.sh
          python3 -m py_compile kit/integration/*.py tests/*.py
      - name: Source contract and reproducibility tests
        run: python3 -m unittest discover -s tests -v

  qt-source-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 development and runtime modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-wayland-dev qt6-wayland \
            qml6-module-qtwayland-compositor qt6-webengine-dev \
            qml6-module-qtcore qml6-module-qtqml qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-templates \\
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtwebengine \
            qml6-module-qtwebengine-controlsdelegates \
            qt6-tools-dev qt6-tools-dev-tools qt6-positioning-dev qt6-webchannel-dev \
            binutils curl util-linux \
            libegl-dev libgl-dev libdrm-dev libgbm-dev libinput-dev \
            libwayland-dev libxkbcommon-dev libudev-dev libdbus-1-dev \
            libfontconfig1-dev libfreetype6-dev libnss3-dev libssl-dev
      - name: Configure Qt project
        run: cmake -S kit/brainos-qt -B out/qt-build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build BrainOS Desktop
        run: cmake --build out/qt-build --parallel 2
      - name: Package complete Qt/WebEngine runtime
        env:
          BUILD_DIR: ${{ github.workspace }}/out/qt-build
          STAGE_DIR: ${{ github.workspace }}/out/brainos-root
          ARTIFACT_DIR: ${{ github.workspace }}/out/artifacts
          BRAINOS_VERSION: ci
          SOURCE_DATE_EPOCH: "0"
        run: ./kit/brainos-qt/packaging/build-release.sh
      - name: Verify runtime archive contents and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="out/artifacts/brainos-runtime-ci-x86_64.tar.gz"
          sha256sum --check "$archive.sha256"
          mkdir -p out/archive-check
          tar -xzf "$archive" -C out/archive-check
          runtime="out/archive-check/opt/brainos"
          test -x "$runtime/bin/brainos-desktop"
          test -x "$runtime/qt/libexec/QtWebEngineProcess"
          test -f "$runtime/qt/plugins/platforms/libqeglfs.so"
          if [[ ! -s "$runtime/qt/resources/icudtl.dat" ]]; then
            find "$runtime/qt/lib" -maxdepth 1 -type f -name 'libicudata.so.*' -print -quit | grep -q .
          fi
          test -d "$runtime/qt/resources/qtwebengine_locales"
          find "$runtime/qt/qml" -type f -name '*.so' -print -quit | grep -q .
          test -x "$runtime/szh/szh-shell"
          test -x "$runtime/szh/bin/sh.real"
          test -x "$runtime/szh/bin/toybox.real"
          test -f "$runtime/szh/usr/lib/libreadline.so.8"
          test -f "$runtime/szh/usr/lib/libncursesw.so.6"
          test -L "$runtime/szh/lib/libc.musl-x86_64.so.1"
          test -L "$runtime/szh/bin/ls"
          shell_output="$(SZH_ROOT="$runtime/szh" "$runtime/szh/szh-shell" -c 'echo SZH_SHELL_OK; ls "$SZH_ROOT/bin/toybox"')"
          grep -q SZH_SHELL_OK <<<"$shell_output"
          pty_output="$(printf 'echo SZH_PTY_OK\nexit\n' | SZH_ROOT="$runtime/szh" script -q -f -e -c "$runtime/szh/szh-shell" /dev/null)"
          grep -q SZH_PTY_OK <<<"$pty_output"
          echo "Release archive passed Qt/WebEngine and SZH interactive PTY smoke checks."
      - name: Upload BrainOS runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: brainos-runtime-ci
          path: |
            out/artifacts/brainos-runtime-ci-x86_64.tar.gz
            out/artifacts/brainos-runtime-ci-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
